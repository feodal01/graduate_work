[project]
name = "ugc-api"
version = "0.1.0"
description = "API закладок, лайков и рецензий на MongoDB"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "aiokafka>=0.12,<1",
    "beanie>=2.0.0,<3",
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "pyjwt>=2.10.1,<3",
    "pymongo>=4.13.0,<5",
    "python-logstash>=0.4.8",
    "sentry-sdk[fastapi]>=2",
]

[dependency-groups]
lint = [
    "mypy>=1.17.0",
    "ruff>=0.12.0",
]
test = [
    "jsonschema>=4.23,<5",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Переменные окружения должны быть заданы до импорта настроек.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "dependencies", "models", "schemas", "security", "services"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["logstash", "logstash.*", "aiokafka", "aiokafka.*"]
ignore_missing_imports = true
