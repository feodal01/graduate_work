[project]
name = "ugc-etl"
version = "0.1.0"
description = "ETL из Kafka в ClickHouse для событий UGC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.14.0",
    "aiochclient[aiohttp]>=2.6.0",
    "aiohttp>=3.11.0",
    "backoff>=2.2.1",
    "fastapi[standard]>=0.141.1",
    "psutil>=7.2.2",
    "pydantic-settings>=2.15.0",
    "sentry-sdk[fastapi]>=2",
    "python-logstash>=0.4.8",
]

[dependency-groups]
lint = [
    "mypy>=2.3.1",
    "pylint>=4.0.8",
    "ruff>=0.16.8",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# functional/ — отдельный suite (свой pytest.ini + docker compose); не мешать unit
norecursedirs = ["functional", ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`.*:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = ["B008", "UP007", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "dependencies", "services"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["logstash", "logstash.*", "aiokafka", "aiokafka.*", "aiochclient", "aiochclient.*", "backoff", "psutil"]
ignore_missing_imports = true

[tool.basedpyright]
extraPaths = ["src"]
pythonVersion = "3.11"

[tool.pylint.main]
py-version = "3.11"
init-hook = 'import sys; sys.path.insert(0, "src")'
source-roots = ["src"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "redefined-outer-name",
]

[tool.pylint.typecheck]
ignored-classes = ["FieldInfo"]
