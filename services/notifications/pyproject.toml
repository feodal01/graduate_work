[project]
name = "notifications"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5,<10",
    "aiokafka>=0.12,<1",
    "aiosmtplib>=4,<6",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "idna>=3,<4",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "pyjwt>=2.10,<3",
    "redis>=6.4,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "jsonschema>=4.23,<5",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src", "migrations"]
python_version = "3.12"
strict = true
