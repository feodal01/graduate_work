[project]
name = "ugc-events"
version = "0.1.0"
description = "API сбора пользовательских действий в Kafka"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.12.0",
    "fastapi[standard]>=0.139.0",
    "pyjwt>=2.10.1,<3",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.14.2",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2",
    "python-logstash>=0.4.8",
]

[dependency-groups]
lint = [
    "mypy>=2.3.0",
    "pylint>=4.0.6",
    "ruff>=0.16.1",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`.*:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = ["B008", "UP007", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "dependencies", "security", "services"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["logstash", "logstash.*", "aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.basedpyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.pylint.main]
py-version = "3.11"
init-hook = 'import sys; sys.path.insert(0, "src")'
source-roots = ["src"]

[tool.pylint.typecheck]
ignored-classes = ["FieldInfo"]
