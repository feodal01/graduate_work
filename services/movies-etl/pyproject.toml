[project]
name = "movies-etl"
version = "0.1.0"
description = "ETL from Postgres to Elasticsearch for movies index"
requires-python = ">=3.10"
dependencies = [
    "backoff>=2.2.1",
    "confluent-kafka>=2.6,<3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postgres_to_es"]

[dependency-groups]
lint = [
    "mypy>=1.17.0",
    "ruff>=0.12.0",
    "types-psycopg2>=2.9.21",
    "types-requests>=2.32.0",
]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the real standalone notifications Compose stack"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# Переменные окружения должны быть заданы до импорта настроек.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["postgres_to_es"]

[tool.mypy]
python_version = "3.10"
files = ["postgres_to_es", "tests"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]
