name: movies-functional-tests

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: movies:test
    environment:
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-movies_test}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_JWT_SECRET: functional-jwt-secret-that-is-long-enough
      AUTH_JWT_ALGORITHM: HS256
      AUTH_SERVICE_URL: http://auth-mock:8000/api/v1/auth
      AUTH_SERVICE_API_KEY: functional-service-key-that-is-long-enough
      AUTH_CONNECT_TIMEOUT: "0.5"
      AUTH_REQUEST_TIMEOUT: "1.0"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-mock:
        condition: service_healthy

  auth-mock:
    image: movies:test
    pull_policy: never
    user: root
    working_dir: /app
    volumes:
      - ../..:/app:ro
    command:
      - uvicorn
      - tests.functional.mock_auth:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${AUTH_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  tests:
    # тот же образ, что собирает api: тесты идут в том, что мы поставляем
    image: movies:test
    pull_policy: never
    # root нужен для pip install и записи в примонтированный репозиторий
    user: root
    working_dir: /app
    volumes:
      - ../..:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      API_URL: http://api:8000
      ES_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-movies_test}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_URL: http://auth-mock:8000/health
    depends_on:
      api:
        condition: service_started
    entrypoint: >
      sh -c "python -m ensurepip
      && python -m pip install --no-cache-dir -r tests/functional/requirements.txt
      && python -m tests.functional.utils.wait_for elasticsearch redis auth api
      && python -m pytest -c tests/functional/pytest.ini
      tests/functional/src -v -p no:cacheprovider"

  elasticsearch:
    image: elasticsearch:8.6.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
