[project]
name = "async-api-sprint-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "backoff>=2.2.1",
    "elasticsearch>=8.6,<9",
    "fastapi[standard]>=0.139.0",
    "pyjwt>=2.10.1,<3",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "redis>=8.0.1",
    "sentry-sdk[fastapi]>=2",
    "python-logstash>=0.4.8",
]

[dependency-groups]
lint = [
    "mypy>=2.3.0",
    "pylint>=4.0.6",
    "ruff>=0.16.1",
]
test = [
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# functional/ — отдельный suite (свой pytest.ini + docker compose); не мешать unit
norecursedirs = ["functional", ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning",
    # Сторонний шум — чиним не мы; иначе unit-тесты красные без пользы
    "ignore::DeprecationWarning:backoff.*",
    # Starlette шлёт UserWarning, не DeprecationWarning
    "ignore:Using `httpx` with `starlette.testclient`.*:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
# FastAPI: Depends()/Query() в defaults — идиома, не баг
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "db", "dependencies", "models", "services"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "logstash",
    "backoff.*",
    "elastic_transport.*",
]
ignore_missing_imports = true

[tool.basedpyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.pylint.main]
init-hook = 'import sys; sys.path.insert(0, "src")'
source-roots = ["src"]
py-version = "3.12"
