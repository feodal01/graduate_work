  elasticsearch-init:
    logging: *default-logging
    image: elasticsearch:8.6.2
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./infra/elasticsearch/snapshots:/usr/share/elasticsearch/snapshots:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$(curl -sS -o /dev/null -w '%{http_code}' "http://elasticsearch:9200/${ELASTICSEARCH_INDEX}")" = "200" ]; then
          echo "${ELASTICSEARCH_INDEX} already exists; skip restore"
        else
          echo "Register snapshot repository sprint3_backup"
          curl -fsS -X PUT "http://elasticsearch:9200/_snapshot/sprint3_backup" \
            -H 'Content-Type: application/json' \
            -d '{"type":"fs","settings":{"location":"/usr/share/elasticsearch/snapshots","readonly":true}}' \
            > /dev/null

          echo "Restore snapshot movies_20260714_genre_ids"
          curl -fsS -X POST \
            "http://elasticsearch:9200/_snapshot/sprint3_backup/movies_20260714_genre_ids/_restore?wait_for_completion=true" \
            -H 'Content-Type: application/json' \
            -d '{"indices":"movies","include_global_state":false,"index_settings":{"index.number_of_replicas":0}}' \
            > /dev/null
          echo "Index ${ELASTICSEARCH_INDEX} restored"
        fi

        echo "Ensure creation_date mapping"
        curl -fsS -X PUT "http://elasticsearch:9200/${ELASTICSEARCH_INDEX}/_mapping" \
          -H 'Content-Type: application/json' \
          -d '{"properties":{"creation_date":{"type":"date"}}}' \
          > /dev/null

