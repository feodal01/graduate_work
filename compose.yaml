# Ротация stdout/stderr контейнеров (docker compose logs): до 3 файлов по 10 МБ на контейнер.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-auth-source-env: &auth-source-env
  PYTHONPATH: /app/src
  POSTGRES_USER: ${AUTH_POSTGRES_USER}
  POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
  POSTGRES_DB: ${AUTH_POSTGRES_DB}
  POSTGRES_HOST: auth-db
  POSTGRES_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
  AUTH_RELAY_TOPIC: auth.users.v1
  AUTH_RELAY_BATCH_SIZE: ${AUTH_RELAY_BATCH_SIZE}
  AUTH_RELAY_POLL_INTERVAL_SECONDS: ${AUTH_RELAY_POLL_INTERVAL_SECONDS}

x-ugc-source-env: &ugc-source-env
  MONGO_URI: mongodb://mongos1:27017,mongos2:27017
  MONGO_DB: ugc
  AUTH_JWT_SECRET: ${JWT_SECRET}
  KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
  KAFKA_LIKES_TOPIC: ugc.reviews.v1
  RELAY_BATCH_SIZE: ${UGC_RELAY_BATCH_SIZE:-500}
  BOOTSTRAP_BATCH_SIZE: ${UGC_BOOTSTRAP_BATCH_SIZE:-500}
  RELAY_MONGO_TRANSACTION_LIFETIME_SECONDS: ${UGC_TRANSACTION_LIFETIME_SECONDS}

x-movies-source-env: &movies-source-env
  POSTGRES_USER: ${THEATRE_POSTGRES_USER}
  POSTGRES_PASSWORD: ${THEATRE_POSTGRES_PASSWORD}
  POSTGRES_DB: ${THEATRE_POSTGRES_DB}
  SQL_HOST: theatre-db
  SQL_PORT: "5432"
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX}
  KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
  KAFKA_MOVIES_TOPIC: movies.films.v1
  CATALOG_BATCH_SIZE: ${CATALOG_BATCH_SIZE:-500}
  CATALOG_RELAY_BATCH_SIZE: ${CATALOG_RELAY_BATCH_SIZE:-500}
  CATALOG_LEGACY_BATCH_SIZE: ${CATALOG_LEGACY_BATCH_SIZE:-500}
  CATALOG_SCAN_INTERVAL_SECONDS: ${CATALOG_SCAN_INTERVAL_SECONDS}
  CATALOG_OVERLAP_SECONDS: ${CATALOG_OVERLAP_SECONDS}
  CATALOG_RECONCILE_INTERVAL_SECONDS: ${CATALOG_RECONCILE_INTERVAL_SECONDS}

x-notifications-env: &notifications-env
  NOTIFICATIONS_FILMS_PER_DIGEST: ${NOTIFICATIONS_FILMS_PER_DIGEST:-20}
  NOTIFICATIONS_SEND_WINDOW_START: ${NOTIFICATIONS_SEND_WINDOW_START:-10:00}
  NOTIFICATIONS_SEND_WINDOW_END: ${NOTIFICATIONS_SEND_WINDOW_END:-20:00}
  NOTIFICATIONS_DATABASE_URL: postgresql+asyncpg://${NOTIFICATIONS_POSTGRES_USER}:${NOTIFICATIONS_POSTGRES_PASSWORD}@notifications-db:5432/${NOTIFICATIONS_POSTGRES_DB}

x-notifications-limiter-env: &notifications-limiter-env
  NOTIFICATIONS_LIMITER_REDIS_URL: ${NOTIFICATIONS_LIMITER_REDIS_URL}
  NOTIFICATIONS_LIMITER_ACCOUNT_ID: ${NOTIFICATIONS_LIMITER_ACCOUNT_ID}
  NOTIFICATIONS_LIMITER_TOTAL_RATE: ${NOTIFICATIONS_LIMITER_TOTAL_RATE}
  NOTIFICATIONS_LIMITER_TOTAL_CAPACITY: ${NOTIFICATIONS_LIMITER_TOTAL_CAPACITY}
  NOTIFICATIONS_LIMITER_TRANSACTIONAL_RATE: ${NOTIFICATIONS_LIMITER_TRANSACTIONAL_RATE}
  NOTIFICATIONS_LIMITER_TRANSACTIONAL_CAPACITY: ${NOTIFICATIONS_LIMITER_TRANSACTIONAL_CAPACITY}
  NOTIFICATIONS_LIMITER_SERVICE_RATE: ${NOTIFICATIONS_LIMITER_SERVICE_RATE}
  NOTIFICATIONS_LIMITER_SERVICE_CAPACITY: ${NOTIFICATIONS_LIMITER_SERVICE_CAPACITY}
  NOTIFICATIONS_LIMITER_BULK_RATE: ${NOTIFICATIONS_LIMITER_BULK_RATE}
  NOTIFICATIONS_LIMITER_BULK_CAPACITY: ${NOTIFICATIONS_LIMITER_BULK_CAPACITY}
  NOTIFICATIONS_LIMITER_UNAVAILABLE_RETRY_SECONDS: ${NOTIFICATIONS_LIMITER_UNAVAILABLE_RETRY_SECONDS}
  NOTIFICATIONS_LIMITER_REDIS_TIMEOUT_SECONDS: ${NOTIFICATIONS_LIMITER_REDIS_TIMEOUT_SECONDS}

x-notifications-runtime: &notifications-runtime
  logging: *default-logging
  build: ./services/notifications
  restart: unless-stopped
  depends_on:
    notifications-migrate:
      condition: service_completed_successfully

x-notifications-worker: &notifications-worker
  <<: *notifications-runtime
  stop_grace_period: 60s
  env_file:
    - path: ./infra/notifications/smtp.env
      required: false
  environment:
    <<: [*notifications-env, *notifications-limiter-env]
    NOTIFICATIONS_PROCESS: worker
    NOTIFICATIONS_RECOVERY_BATCH_SIZE: ${NOTIFICATIONS_RECOVERY_BATCH_SIZE:-100}
    NOTIFICATIONS_RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/notifications
    NOTIFICATIONS_SMTP_HOST: ${NOTIFICATIONS_SMTP_HOST}
    NOTIFICATIONS_SMTP_PORT: ${NOTIFICATIONS_SMTP_PORT}
    NOTIFICATIONS_SMTP_FROM: ${NOTIFICATIONS_SMTP_FROM}
    NOTIFICATIONS_SMTP_STARTTLS: ${NOTIFICATIONS_SMTP_STARTTLS}
    NOTIFICATIONS_FALLBACK_LOCALE: ${NOTIFICATIONS_FALLBACK_LOCALE}
    NOTIFICATIONS_FALLBACK_TZ: ${NOTIFICATIONS_FALLBACK_TZ}
    NOTIFICATIONS_AUTH_CONTACTS_URL: http://auth:8000/api/v1/internal/notification-contacts
    NOTIFICATIONS_AUTH_CONTACTS_API_KEY: ${SERVICE_API_KEY}
    NOTIFICATIONS_AUTH_CONTACTS_TIMEOUT_SECONDS: ${NOTIFICATIONS_AUTH_CONTACTS_TIMEOUT_SECONDS}
    NOTIFICATIONS_AUTH_CONTACTS_RETRY_SECONDS: ${NOTIFICATIONS_AUTH_CONTACTS_RETRY_SECONDS}
    NOTIFICATIONS_AUTH_CONTACTS_BATCH_SIZE: ${NOTIFICATIONS_AUTH_CONTACTS_BATCH_SIZE}
  depends_on:
    notifications-migrate:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
    notifications-redis:
      condition: service_started
    notifications-mailpit:
      condition: service_healthy
    notifications-maintenance:
      condition: service_started


services:
  theatre-db:
    logging: *default-logging
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${THEATRE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${THEATRE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${THEATRE_POSTGRES_DB}
    volumes:
      - ./services/admin/database_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - theatre_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-db:
    logging: *default-logging
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  movies-redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    logging: *default-logging
    image: elasticsearch:8.6.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      path.repo: /usr/share/elasticsearch/snapshots
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./infra/elasticsearch/snapshots:/usr/share/elasticsearch/snapshots:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  jaeger:
    logging: *default-logging
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT}:16686"
      - "127.0.0.1:${JAEGER_OTLP_HTTP_PORT}:4318"

  elk-elasticsearch:
    logging: *default-logging
    image: elasticsearch:8.10.2
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elk_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  logstash:
    logging: *default-logging
    image: logstash:8.10.2
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      XPACK_MONITORING_ENABLED: "false"
      ES_HOST: http://elk-elasticsearch:9200
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./infra/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elk-elasticsearch:
        condition: service_healthy

  kibana:
    logging: *default-logging
    image: kibana:8.10.2
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elk-elasticsearch:9200
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elk-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Data views app-* и nginx-*; повторный запуск ничего не меняет.
  kibana-bootstrap:
    logging: *default-logging
    image: kibana:8.10.2
    profiles: ["observability"]
    restart: "no"
    environment:
      KIBANA_URL: http://kibana:5601
    volumes:
      - ./infra/kibana/bootstrap.js:/bootstrap.js:ro
    # Node из образа Kibana: curl есть, а jq для разбора ответов API нет.
    entrypoint: ["/usr/share/kibana/node/bin/node", "/bootstrap.js"]
    depends_on:
      kibana:
        condition: service_healthy

  filebeat:
    logging: *default-logging
    image: elastic/filebeat:8.10.2
    profiles: ["observability"]
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./infra/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - logstash
      - gateway

  sentry-db:
    logging: *default-logging
    image: postgres:17
    profiles: ["observability"]
    restart: unless-stopped
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    environment:
      POSTGRES_USER: ${SENTRY_DB_USER}
      POSTGRES_PASSWORD: ${SENTRY_DB_PASSWORD}
      POSTGRES_DB: ${SENTRY_DB_NAME}
    volumes:
      - sentry_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  sentry-redis:
    logging: *default-logging
    image: redis:7-alpine
    profiles: ["observability"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted сервер, совместимый с Sentry SDK (принимает /envelope/).
  glitchtip:
    logging: *default-logging
    image: glitchtip/glitchtip:6.2.6
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${SENTRY_DB_USER}:${SENTRY_DB_PASSWORD}@sentry-db:5432/${SENTRY_DB_NAME}
      VALKEY_URL: redis://sentry-redis:6379/0
      SECRET_KEY: ${SENTRY_SECRET_KEY}
      # Миграции при старте + встроенный воркер задач в том же процессе.
      SERVER_ROLE: all_in_one
      PORT: "8000"
      GLITCHTIP_DOMAIN: http://localhost:${SENTRY_PORT:-9000}
      DEFAULT_FROM_EMAIL: glitchtip@localhost
    ports:
      - "127.0.0.1:${SENTRY_PORT:-9000}:8000"
    depends_on:
      sentry-db:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "/code/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Администратор и проект с id и ключом из SENTRY_DSN; повторный запуск ничего не меняет.
  glitchtip-bootstrap:
    logging: *default-logging
    image: glitchtip/glitchtip:6.2.6
    profiles: ["observability"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${SENTRY_DB_USER}:${SENTRY_DB_PASSWORD}@sentry-db:5432/${SENTRY_DB_NAME}
      VALKEY_URL: redis://sentry-redis:6379/0
      SECRET_KEY: ${SENTRY_SECRET_KEY}
      SENTRY_ADMIN_EMAIL: ${SENTRY_ADMIN_EMAIL}
      SENTRY_ADMIN_PASSWORD: ${SENTRY_ADMIN_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./infra/glitchtip/bootstrap.py:/code/bootstrap.py:ro
      - ./infra/glitchtip/bootstrap_settings.py:/code/bootstrap_settings.py:ro
    command: ["python", "bootstrap.py"]
    depends_on:
      glitchtip:
        condition: service_healthy

  kafka-0:
    logging: *default-logging
    image: bitnamilegacy/kafka:3.4
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_0_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-1:
    logging: *default-logging
    image: bitnamilegacy/kafka:3.4
    restart: unless-stopped
    ports:
      - "9095:9095"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://127.0.0.1:9095
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_1_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-2:
    logging: *default-logging
    image: bitnamilegacy/kafka:3.4
    restart: unless-stopped
    ports:
      - "9096:9096"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://127.0.0.1:9096
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_2_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-init:
    logging: *default-logging
    image: bitnamilegacy/kafka:3.4
    restart: "no"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        kafka-topics.sh --bootstrap-server kafka-0:9092 --create --if-not-exists --topic ugc.events --partitions 6 --replication-factor 3
        kafka-topics.sh --bootstrap-server kafka-0:9092 --create --if-not-exists --topic ugc.events.dlq --partitions 6 --replication-factor 3
        kafka-topics.sh --bootstrap-server kafka-0:9092 --create --if-not-exists --topic auth.users.v1 --partitions 6 --replication-factor 3
        kafka-topics.sh --bootstrap-server kafka-0:9092 --create --if-not-exists --topic ugc.reviews.v1 --partitions 6 --replication-factor 3
        kafka-topics.sh --bootstrap-server kafka-0:9092 --create --if-not-exists --topic movies.films.v1 --partitions 6 --replication-factor 3

  zookeeper:
    logging: *default-logging
    image: zookeeper:3.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/commands/ruok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clickhouse-node1:
    logging: *default-logging
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_node1_data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./infra/clickhouse/node1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  clickhouse-node2:
    logging: *default-logging
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_node2_data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./infra/clickhouse/node2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  clickhouse-node3:
    logging: *default-logging
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_node3_data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./infra/clickhouse/node3.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  clickhouse-node4:
    logging: *default-logging
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_node4_data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./infra/clickhouse/node4.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

