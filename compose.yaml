      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ugc-events-redis:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ugc-api:
    logging: *default-logging
    build:
      context: ./services/ugc-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROJECT_NAME: ugc-api
      AUTH_JWT_SECRET: ${JWT_SECRET}
      AUTH_JWT_ALGORITHM: ${JWT_ALGORITHM}
      MONGO_URI: mongodb://mongos1:27017,mongos2:27017
      MONGO_DB: ugc
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    depends_on:
      mongos1:
        condition: service_healthy
      mongos2:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ugc-etl:
    logging: *default-logging
    build:
      context: ./services/ugc-etl
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
      ETL_STALL_TIMEOUT_SECONDS: ${UGC_ETL_STALL_TIMEOUT_SECONDS:-360}
      EVENTS_MAX_AGE_SECONDS: ${UGC_EVENTS_MAX_AGE_SECONDS:-604800}
      EVENTS_MAX_FUTURE_SKEW_SECONDS: ${UGC_EVENTS_MAX_FUTURE_SKEW_SECONDS:-300}
      CLICKHOUSE_HOST: clickhouse-node1
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    volumes:
      - ./infra/clickhouse/init.sql:/app/init.sql:ro
    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse-node1:
        condition: service_healthy
      clickhouse-node2:
        condition: service_healthy
      clickhouse-node3:
        condition: service_healthy
      clickhouse-node4:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  movies-etl:
    logging: *default-logging
    build:
      context: ./services/movies-etl
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${THEATRE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${THEATRE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${THEATRE_POSTGRES_DB}
      SQL_HOST: theatre-db
      SQL_PORT: "5432"
      STATE_DATABASE_FILE_PATH: ${ETL_STATE_DATABASE_FILE_PATH}
      PRODUCER_BATCH_SIZE: ${ETL_PRODUCER_BATCH_SIZE}
      WORKER_LEASE_SECONDS: ${ETL_WORKER_LEASE_SECONDS}
      JOB_MAX_ATTEMPTS: ${ETL_JOB_MAX_ATTEMPTS}
      WORKER_POLL_INTERVAL_SECONDS: ${ETL_WORKER_POLL_INTERVAL_SECONDS}
      LOG_LEVEL: ${ETL_LOG_LEVEL}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX}
      ELASTICSEARCH_TIMEOUT_SECONDS: ${ETL_ELASTICSEARCH_TIMEOUT_SECONDS}
      POSTGRES_BACKOFF__MAX_TRIES: ${ETL_POSTGRES_BACKOFF_MAX_TRIES}
      POSTGRES_BACKOFF__INITIAL_DELAY: ${ETL_POSTGRES_BACKOFF_INITIAL_DELAY}
      POSTGRES_BACKOFF__MAX_DELAY: ${ETL_POSTGRES_BACKOFF_MAX_DELAY}
      POSTGRES_BACKOFF__MULTIPLIER: ${ETL_POSTGRES_BACKOFF_MULTIPLIER}
      ELASTICSEARCH_BACKOFF__MAX_TRIES: ${ETL_ELASTICSEARCH_BACKOFF_MAX_TRIES}
      ELASTICSEARCH_BACKOFF__INITIAL_DELAY: ${ETL_ELASTICSEARCH_BACKOFF_INITIAL_DELAY}
      ELASTICSEARCH_BACKOFF__MAX_DELAY: ${ETL_ELASTICSEARCH_BACKOFF_MAX_DELAY}
      ELASTICSEARCH_BACKOFF__MULTIPLIER: ${ETL_ELASTICSEARCH_BACKOFF_MULTIPLIER}
    volumes:
      - movies_etl_state:/app/state
    depends_on:
      theatre-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully

  # Local email capture: workers use SMTP :1025, reviewers use the web UI :8025.
  notifications-mailpit:
    logging: *default-logging
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
    volumes:
      - notifications_mailpit_data:/data
    ports:
      - "127.0.0.1:${NOTIFICATIONS_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  notifications-redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--no-appendfsync-on-rewrite", "no", "--maxmemory-policy", "noeviction"]
    volumes:
      - notifications_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Operator action only. No worker depends on this service; startup never resets tokens.
  notifications-limiter-init:
    logging: *default-logging
    build: ./services/notifications
    profiles: ["notifications-bootstrap"]
    restart: "no"
    environment:
      <<: *notifications-limiter-env
    entrypoint: ["python", "-m", "notifications.delivery.rate_limit"]
    command: ["initialize", "--cooldown-seconds", "${NOTIFICATIONS_LIMITER_COOLDOWN_SECONDS}"]
    depends_on:
      notifications-redis:
        condition: service_healthy

  notifications-db:
    logging: *default-logging
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${NOTIFICATIONS_POSTGRES_DB}
    volumes:
      - notifications_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4.1.4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: notifications
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  notifications-migrate:
    logging: *default-logging
    build: ./services/notifications
    restart: "no"
    environment:
      <<: *notifications-env
      NOTIFICATIONS_PROCESS: bootstrap
    command: ["alembic", "upgrade", "head"]
    depends_on:
      notifications-db:
        condition: service_healthy

  notifications-maintenance:
    <<: *notifications-runtime
    environment:
      NOTIFICATIONS_DATABASE_URL: postgresql+asyncpg://${NOTIFICATIONS_POSTGRES_USER}:${NOTIFICATIONS_POSTGRES_PASSWORD}@notifications-db:5432/${NOTIFICATIONS_POSTGRES_DB}
      NOTIFICATIONS_MAINTENANCE_BATCH_SIZE: ${NOTIFICATIONS_MAINTENANCE_BATCH_SIZE}
      NOTIFICATIONS_MAINTENANCE_POLL_SECONDS: ${NOTIFICATIONS_MAINTENANCE_POLL_SECONDS}
      NOTIFICATIONS_DELIVERY_PAYLOAD_RETENTION_SECONDS: ${NOTIFICATIONS_DELIVERY_PAYLOAD_RETENTION_SECONDS}
    command: ["python", "-m", "notifications.maintenance"]

  notifications-api:
    <<: *notifications-runtime
    environment:
      <<: *notifications-env
      NOTIFICATIONS_PROCESS: api
      NOTIFICATIONS_JWT_SECRET: ${JWT_SECRET}
      NOTIFICATIONS_JWT_ALGORITHM: ${JWT_ALGORITHM}
      NOTIFICATIONS_AUTH_INTROSPECTION_URL: http://auth:8000/api/v1/internal/introspect
      NOTIFICATIONS_AUTH_INTROSPECTION_API_KEY: ${SERVICE_API_KEY}
      NOTIFICATIONS_AUTH_INTROSPECTION_TIMEOUT_SECONDS: ${NOTIFICATIONS_AUTH_INTROSPECTION_TIMEOUT_SECONDS}
    command: ["uvicorn", "notifications.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Internal campaign API with required service-key authentication.
  notifications-campaign-api:
    <<: *notifications-runtime
    environment:
      <<: *notifications-env
      NOTIFICATIONS_PROCESS: campaign-api
      NOTIFICATIONS_CAMPAIGN_BATCH_SIZE: ${NOTIFICATIONS_CAMPAIGN_BATCH_SIZE:-100}
      NOTIFICATIONS_CAMPAIGN_API_KEY: ${NOTIFICATIONS_CAMPAIGN_API_KEY}
    command: ["uvicorn", "notifications.campaigns.app:create_campaign_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  billing-db:
    logging: *default-logging
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "synchronous_commit=on"]
    environment:
      POSTGRES_USER: ${BILLING_POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${BILLING_POSTGRES_PASSWORD:-local-billing-password}
      POSTGRES_DB: ${BILLING_POSTGRES_DB:-billing}
    volumes:
      - billing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  billing-migrate:
    logging: *default-logging
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    restart: "no"
    environment:
      POSTGRES_USER: ${BILLING_POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${BILLING_POSTGRES_PASSWORD:-local-billing-password}
      POSTGRES_DB: ${BILLING_POSTGRES_DB:-billing}
      POSTGRES_HOST: billing-db
      POSTGRES_PORT: "5432"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      billing-db:
        condition: service_healthy

  billing-api:
    logging: *default-logging
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${BILLING_POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${BILLING_POSTGRES_PASSWORD:-local-billing-password}
      POSTGRES_DB: ${BILLING_POSTGRES_DB:-billing}
      POSTGRES_HOST: billing-db
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      NOTIFICATIONS_CAMPAIGN_API_KEY: ${NOTIFICATIONS_CAMPAIGN_API_KEY}
      AUTH_SERVICE_URL: http://auth:8000
      NOTIFICATIONS_CAMPAIGN_URL: http://notifications-campaign-api:8000
      PAYMENT_PROVIDER_ACTIVE: ${PAYMENT_PROVIDER_ACTIVE:-yookassa}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-replace-with-test-yookassa-shop-id}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-replace-with-test-yookassa-secret-key}
      YOOKASSA_API_BASE_URL: ${YOOKASSA_API_BASE_URL:-https://api.yookassa.ru/v3}
      YOOKASSA_TIMEOUT_SECONDS: ${YOOKASSA_TIMEOUT_SECONDS:-5.0}
      BILLING_PUBLIC_BASE_URL: ${BILLING_PUBLIC_BASE_URL:-http://localhost}
      BILLING_RECONCILE_INTERVAL_SECONDS: ${BILLING_RECONCILE_INTERVAL_SECONDS:-30.0}
      RECONCILE_MIN_AGE_SECONDS: ${RECONCILE_MIN_AGE_SECONDS:-5.0}
      BILLING_OUTBOX_INTERVAL_SECONDS: ${BILLING_OUTBOX_INTERVAL_SECONDS:-2.0}
      BILLING_OUTBOX_MAX_ATTEMPTS: ${BILLING_OUTBOX_MAX_ATTEMPTS:-20}
      BILLING_STUCK_THRESHOLD_SECONDS: ${BILLING_STUCK_THRESHOLD_SECONDS:-600}
      TRACING_ENABLED: ${BILLING_TRACING_ENABLED:-true}
      TRACING_SERVICE_NAME: ${BILLING_TRACING_SERVICE_NAME:-billing}
      TRACING_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLE_RATE: ${BILLING_TRACING_SAMPLE_RATE:-0.05}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    command: ["uvicorn", "main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/api/v1/health/',
          headers={'X-Request-Id': 'billing-compose-health'});
          urllib.request.urlopen(request, timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  billing-worker:
    logging: *default-logging
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${BILLING_POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${BILLING_POSTGRES_PASSWORD:-local-billing-password}
      POSTGRES_DB: ${BILLING_POSTGRES_DB:-billing}
      POSTGRES_HOST: billing-db
      POSTGRES_PORT: "5432"
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      NOTIFICATIONS_CAMPAIGN_API_KEY: ${NOTIFICATIONS_CAMPAIGN_API_KEY}
      AUTH_SERVICE_URL: http://auth:8000
      NOTIFICATIONS_CAMPAIGN_URL: http://notifications-campaign-api:8000
      PAYMENT_PROVIDER_ACTIVE: ${PAYMENT_PROVIDER_ACTIVE:-yookassa}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-replace-with-test-yookassa-shop-id}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-replace-with-test-yookassa-secret-key}
      YOOKASSA_API_BASE_URL: ${YOOKASSA_API_BASE_URL:-https://api.yookassa.ru/v3}
      YOOKASSA_TIMEOUT_SECONDS: ${YOOKASSA_TIMEOUT_SECONDS:-5.0}
      BILLING_PUBLIC_BASE_URL: ${BILLING_PUBLIC_BASE_URL:-http://localhost}
      BILLING_RECONCILE_INTERVAL_SECONDS: ${BILLING_RECONCILE_INTERVAL_SECONDS:-30.0}
      RECONCILE_MIN_AGE_SECONDS: ${RECONCILE_MIN_AGE_SECONDS:-5.0}
      BILLING_OUTBOX_INTERVAL_SECONDS: ${BILLING_OUTBOX_INTERVAL_SECONDS:-2.0}
      BILLING_OUTBOX_MAX_ATTEMPTS: ${BILLING_OUTBOX_MAX_ATTEMPTS:-20}
      BILLING_STUCK_THRESHOLD_SECONDS: ${BILLING_STUCK_THRESHOLD_SECONDS:-600}
      TRACING_ENABLED: ${BILLING_TRACING_ENABLED:-true}
      TRACING_SERVICE_NAME: ${BILLING_TRACING_SERVICE_NAME:-billing}-worker
      TRACING_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLE_RATE: ${BILLING_TRACING_SAMPLE_RATE:-0.05}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    healthcheck: {disable: true}
    command: ["python", "-m", "worker"]
    depends_on:
      billing-migrate:
        condition: service_completed_successfully

  notifications-consumer:
    <<: *notifications-runtime
    environment:
      <<: *notifications-env
      NOTIFICATIONS_PROCESS: consumer
      NOTIFICATIONS_CONSUMER_BATCH_SIZE: ${NOTIFICATIONS_CONSUMER_BATCH_SIZE:-500}
      NOTIFICATIONS_KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
      NOTIFICATIONS_INITIAL_LIKES: ${NOTIFICATIONS_INITIAL_LIKES}
      NOTIFICATIONS_INITIAL_NEW_FILMS: ${NOTIFICATIONS_INITIAL_NEW_FILMS}
      NOTIFICATIONS_INITIAL_MARKETING: ${NOTIFICATIONS_INITIAL_MARKETING}
    command: ["python", "-m", "notifications", "--group", "notifications-v1"]
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  notifications-scheduler:
    <<: *notifications-runtime
    profiles: ["notifications-scheduling"]
    environment:
      <<: *notifications-env
      NOTIFICATIONS_PROCESS: scheduler
      NOTIFICATIONS_SCHEDULER_BATCH_SIZE: ${NOTIFICATIONS_SCHEDULER_BATCH_SIZE:-500}
      NOTIFICATIONS_LIKES_MIN_DELTA: ${NOTIFICATIONS_LIKES_MIN_DELTA}
      NOTIFICATIONS_LIKES_SCHEDULE_ANCHOR_UTC: ${NOTIFICATIONS_LIKES_SCHEDULE_ANCHOR_UTC:-1970-01-01T00:00:00Z}
      NOTIFICATIONS_FILMS_SCHEDULE_ANCHOR_UTC: ${NOTIFICATIONS_FILMS_SCHEDULE_ANCHOR_UTC:-1970-01-01T00:00:00Z}
      NOTIFICATIONS_LIKES_INTERVAL_SECONDS: ${NOTIFICATIONS_LIKES_INTERVAL_SECONDS}
      NOTIFICATIONS_FILMS_INTERVAL_SECONDS: ${NOTIFICATIONS_FILMS_INTERVAL_SECONDS}
      NOTIFICATIONS_LIKES_BOOTSTRAP_LOAD_ID: ${NOTIFICATIONS_LIKES_BOOTSTRAP_LOAD_ID}
    command: ["python", "-m", "notifications.scheduling.scheduler"]

  notifications-publisher:
    <<: *notifications-runtime
    environment:
      <<: *notifications-env
      NOTIFICATIONS_PROCESS: publisher
      NOTIFICATIONS_TRANSACTIONAL_BATCH_SIZE: ${NOTIFICATIONS_TRANSACTIONAL_BATCH_SIZE}
      NOTIFICATIONS_SERVICE_BATCH_SIZE: ${NOTIFICATIONS_SERVICE_BATCH_SIZE}
      NOTIFICATIONS_BULK_BATCH_SIZE: ${NOTIFICATIONS_BULK_BATCH_SIZE}
      NOTIFICATIONS_RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/notifications
    command: ["python", "-m", "notifications.delivery.publisher", "--poll-seconds", "${NOTIFICATIONS_PUBLISHER_POLL_SECONDS}"]
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notifications-worker-transactional:
    <<: *notifications-worker
    command: ["python", "-m", "notifications.delivery.worker", "--send-class", "transactional", "--max-concurrency", "${NOTIFICATIONS_TRANSACTIONAL_CONCURRENCY}", "--retry-seconds", "${NOTIFICATIONS_RETRY_SECONDS}", "--max-attempts", "${NOTIFICATIONS_MAX_ATTEMPTS}"]

  notifications-worker-service:
    <<: *notifications-worker
    command: ["python", "-m", "notifications.delivery.worker", "--send-class", "service", "--max-concurrency", "${NOTIFICATIONS_SERVICE_CONCURRENCY}", "--retry-seconds", "${NOTIFICATIONS_RETRY_SECONDS}", "--max-attempts", "${NOTIFICATIONS_MAX_ATTEMPTS}"]

  notifications-worker-bulk:
    <<: *notifications-worker
    command: ["python", "-m", "notifications.delivery.worker", "--send-class", "bulk", "--max-concurrency", "${NOTIFICATIONS_BULK_CONCURRENCY}", "--retry-seconds", "${NOTIFICATIONS_RETRY_SECONDS}", "--max-attempts", "${NOTIFICATIONS_MAX_ATTEMPTS}"]

  notifications-bootstrap:
    <<: *notifications-runtime
    profiles: ["notifications-bootstrap"]
    restart: "no"
    environment:
      <<: *notifications-env
      NOTIFICATIONS_PROCESS: bootstrap
    volumes:
      - ./infra/notifications:/bootstrap:ro
    entrypoint: ["python", "-m", "notifications.ingest.bootstrap"]
    command: ["register", "--manifest", "/bootstrap/ugc-manifest.json"]

  auth-relay:
    logging: *default-logging
    build: ./services/auth
    restart: unless-stopped
    environment: *auth-source-env
    healthcheck: {disable: true}
    command: ["python", "-m", "relay"]
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  auth-notifications-bootstrap:
    logging: *default-logging
    build: ./services/auth
    profiles: ["notifications-bootstrap"]
    restart: "no"
    environment: *auth-source-env
    healthcheck: {disable: true}
    entrypoint: ["python", "-m", "bootstrap_notifications"]
    command: ["--load-id", "${AUTH_NOTIFICATIONS_LOAD_ID}"]
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  ugc-relay:
    logging: *default-logging
    build: ./services/ugc-api
    restart: unless-stopped
    environment: *ugc-source-env
    healthcheck: {disable: true}
    command: ["python", "-m", "relay"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  ugc-notifications-bootstrap:
    logging: *default-logging
    build: ./services/ugc-api
    profiles: ["notifications-bootstrap"]
    restart: "no"
    environment: *ugc-source-env
    healthcheck: {disable: true}
    entrypoint: ["python", "-m", "bootstrap_notifications"]
    command: ["status", "--load-id", "${NOTIFICATIONS_LIKES_BOOTSTRAP_LOAD_ID}"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  movies-detector:
    logging: *default-logging
    build: ./services/movies-etl
    profiles: ["notifications-detection"]
    restart: unless-stopped
    environment: *movies-source-env
    command: ["python", "-m", "postgres_to_es.catalog_events", "detect"]
    depends_on:
      admin-migrate:
        condition: service_completed_successfully
      elasticsearch-init:
        condition: service_completed_successfully

  movies-relay:
    logging: *default-logging
    build: ./services/movies-etl
    restart: unless-stopped
    environment: *movies-source-env
    command: ["python", "-m", "postgres_to_es.catalog_events", "relay"]
    depends_on:
      admin-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  movies-notifications-bootstrap:
    logging: *default-logging
    build: ./services/movies-etl
    profiles: ["notifications-bootstrap"]
    restart: "no"
    environment: *movies-source-env
    entrypoint: ["python", "-m", "postgres_to_es.catalog_events"]
    command: ["bootstrap", "status", "--load-id", "${MOVIES_NOTIFICATIONS_LOAD_ID}"]
    depends_on:
      admin-migrate:
        condition: service_completed_successfully
      elasticsearch-init:
        condition: service_completed_successfully

  gateway:
    logging: *default-logging
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - admin_static:/opt/app/static:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      notifications-api:
        condition: service_healthy
      admin:
        condition: service_healthy
      movies-api:
        condition: service_healthy
      ugc-events:
        condition: service_healthy
      ugc-api:
        condition: service_healthy
      billing-api:
        condition: service_healthy

  # Ротация файлов nginx для filebeat; stdout контейнеров ротирует сам Docker (x-logging).
  nginx-logrotate:
    logging: *default-logging
    build: ./infra/logrotate
    restart: unless-stopped
    init: true
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      - gateway

  auth-rate-limit-load-test:
    logging: *default-logging
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    profiles: ["load-test"]
    environment:
      AUTH_BASE_URL: http://auth:8000
      GATEWAY_BASE_URL: http://gateway
    volumes:
      - ./tests/load:/load:ro
    command: ["python", "/load/auth_rate_limit.py"]
    depends_on:
      auth:
        condition: service_healthy
      gateway:
        condition: service_started

