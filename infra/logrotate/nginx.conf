# Файлы nginx для filebeat в томе nginx_logs.
# copytruncate: файл обрезается на месте, nginx не нужно переоткрывать его по
# сигналу (nginx пишет с O_APPEND), а filebeat замечает обрезку и читает с начала.
/var/log/nginx/access-log.json /var/log/nginx/error-log.log {
    size 50M
    rotate 2
    compress
    copytruncate
    missingok
    notifempty
}
