worker_processes auto;

# Ошибки nginx: в stderr (docker compose logs; error.log в образе — симлинк на stderr)
# и в файл для filebeat -> logstash -> ELK. Без явного error_log nginx пишет только
# в stderr, поэтому директива для stderr указана тоже.
error_log /var/log/nginx/error.log error;
error_log /var/log/nginx/error-log.log warn;


events {
    worker_connections  1024;
}


http {
    server_tokens off;

    include       /etc/nginx/mime.types;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'request_id=$request_id '
                      'limit_req_status=$limit_req_status';

    log_format  json  escape=json '{'
                      '"time":"$time_iso8601",'
                      '"request_id":"$request_id",'
                      '"remote_addr":"$remote_addr",'
                      '"remote_user":"$remote_user",'
                      '"request_method":"$request_method",'
                      '"request_uri":"$request_uri",'
                      '"server_protocol":"$server_protocol",'
                      '"http_host":"$http_host",'
                      '"status":$status,'
                      '"body_bytes_sent":$body_bytes_sent,'
                      '"request_time":$request_time,'
                      '"upstream_addr":"$upstream_addr",'
                      '"upstream_status":"$upstream_status",'
                      '"upstream_response_time":"$upstream_response_time",'
                      '"http_referer":"$http_referer",'
                      '"http_user_agent":"$http_user_agent",'
                      '"http_x_forwarded_for":"$http_x_forwarded_for",'
                      '"limit_req_status":"$limit_req_status"'
                      '}';

    access_log /var/log/nginx/access.log main;
    # JSON-копия для filebeat -> logstash -> ELK.
    access_log /var/log/nginx/access-log.json json;

    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=events_per_ip:10m rate=20r/s;

    sendfile        on;
    tcp_nodelay     on;
    tcp_nopush      on;

    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 3;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/json
        application/x-javascript
        text/xml
        text/javascript;

    proxy_redirect     off;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-Id     $request_id;

    set_real_ip_from  192.168.1.0/24;
    real_ip_header    X-Forwarded-For;

    include /etc/nginx/conf.d/*.conf;
}
