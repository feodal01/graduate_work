server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $notifications_upstream notifications-api:8000;
    set $admin_upstream admin:8000;
    set $auth_upstream auth:8000;
    set $movies_upstream movies-api:8000;
    set $ugc_upstream ugc-events:8000;
    set $ugc_api_upstream ugc-api:8000;
    set $ugc_etl_upstream ugc-etl:8000;
    set $billing_upstream billing-api:8000;

    limit_req_status 429;
    error_page 429 = @nginx_rate_limited;

    location = /admin/health {
        proxy_pass http://$admin_upstream/health/;
    }

    location = /auth/health {
        proxy_pass http://$auth_upstream/api/v1/health/;
    }

    location = /movies/health {
        proxy_pass http://$movies_upstream/api/v1/health/;
    }

    location = /ugc/health {
        proxy_pass http://$ugc_upstream/api/v1/health/;
    }

    location = /ugc-api/health {
        proxy_pass http://$ugc_api_upstream/api/v1/health/;
    }

    location = /ugc-etl/health {
        proxy_pass http://$ugc_etl_upstream/api/v1/health/;
    }

    location = /billing/health {
        proxy_pass http://$billing_upstream/api/v1/health/;
    }

    location = /auth/docs {
        proxy_pass http://$auth_upstream$request_uri;
    }

    location = /movies/docs {
        proxy_pass http://$movies_upstream$request_uri;
    }

    location = /auth/openapi.json {
        proxy_pass http://$auth_upstream$request_uri;
    }

    location = /movies/openapi.json {
        proxy_pass http://$movies_upstream$request_uri;
    }

    location = /ugc/docs {
        proxy_pass http://$ugc_upstream$request_uri;
    }

    location = /ugc/openapi.json {
        proxy_pass http://$ugc_upstream$request_uri;
    }

    location = /ugc-api/docs {
        proxy_pass http://$ugc_api_upstream$request_uri;
    }

    location = /ugc-api/openapi.json {
        proxy_pass http://$ugc_api_upstream$request_uri;
    }

    location = /billing/docs {
        proxy_pass http://$billing_upstream$request_uri;
    }

    location = /billing/openapi.json {
        proxy_pass http://$billing_upstream$request_uri;
    }

    location = /billing {
        return 301 /billing/;
    }

    location ^~ /billing/ {
        limit_req zone=billing_per_ip burst=20 nodelay;
        error_page 429 = @billing_rate_limited;
        proxy_pass http://$billing_upstream$request_uri;
    }

    location ^~ /api/v1/billing/ {
        limit_req zone=billing_per_ip burst=20 nodelay;
        error_page 429 = @billing_rate_limited;
        proxy_pass http://$billing_upstream$request_uri;
    }

    location = /api/v1/ugc/events {
        limit_req zone=events_per_ip burst=20 nodelay;
        proxy_pass http://$ugc_upstream$request_uri;
    }

    location ^~ /api/v1/ugc/ {
        proxy_pass http://$ugc_api_upstream$request_uri;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_per_ip burst=20 nodelay;
        proxy_pass http://$auth_upstream$request_uri;
    }

    location ^~ /api/v1/notifications/ {
        proxy_pass http://$notifications_upstream$request_uri;
    }

    location @nginx_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"detail":"Too many requests"}';
    }

    location @billing_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error_code":"rate_limit_exceeded","detail":"Too many requests"}';
    }

    location = /api/v1/films {
        proxy_pass http://$movies_upstream$request_uri;
    }

    location ^~ /api/v1/films/ {
        proxy_pass http://$movies_upstream$request_uri;
    }

    location /admin/ {
        proxy_pass http://$admin_upstream$request_uri;
    }

    location ^~ /static/ {
        alias /opt/app/static/;
    }

    location / {
        return 404;
    }
}
