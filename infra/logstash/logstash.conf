input {
  # Логи приложений: python-logstash шлёт JSON по UDP.
  udp {
    port => 5044
    codec => "json"
    # Иначе IP отправителя пишется в [host][ip] и конфликтует со строковым host из лога.
    source_ip_fieldname => "[source][ip]"
  }
  # Логи nginx: filebeat уже разобрал JSON, codec не нужен.
  beats {
    port => 5045
    host => "0.0.0.0"
  }
}

filter {
  # Строка error_log nginx:
  # 2026/09/29 12:01:54 [error] 29#29: *15 connect() failed ..., client: 172.18.0.1, server: _, request: "GET / HTTP/1.1", upstream: "http://..."
  if "nginx-error" in [tags] {
    grok {
      match => {
        "message" => "^(?<nginx_time>%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME}) \[%{LOGLEVEL:level}\] %{POSINT:pid}#%{NUMBER:tid}: (?:\*%{NUMBER:connection_id} )?%{GREEDYDATA:error_message}"
      }
    }
    # Контекст запроса есть не в каждой строке, поэтому отсутствие поля — не ошибка.
    grok {
      match => { "error_message" => ", client: %{IP:client}" }
      tag_on_failure => []
    }
    grok {
      match => { "error_message" => ', request: "%{DATA:request}"' }
      tag_on_failure => []
    }
    grok {
      match => { "error_message" => ', upstream: "%{DATA:upstream}"' }
      tag_on_failure => []
    }
    # Время события, а не время чтения строки filebeat; контейнер nginx работает в UTC.
    date {
      match => ["nginx_time", "yyyy/MM/dd HH:mm:ss"]
      timezone => "UTC"
      remove_field => ["nginx_time"]
    }
  }
}

output {
  if "nginx" in [tags] {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      index => "nginx-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      index => "app-%{+YYYY.MM}"
    }
  }
}
