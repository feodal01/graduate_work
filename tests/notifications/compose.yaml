# Standalone test stack. Never includes the root Compose file or production data.
name: notifications-integration

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: notifications_test
      POSTGRES_PASSWORD: notifications_test
      POSTGRES_DB: notifications_test_admin
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U notifications_test -d notifications_test_admin"]

  mongo:
    # mongo:8.0 exits on startup on GitHub Actions Linux kernel >= 6.19 (SERVER-121912 / SERVER-136848).
    image: mongo:7.0
    command: ["mongod", "--replSet", "notifications-test-rs", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1::27017"
    tmpfs:
      - /data/db
      - /data/configdb
    volumes:
      - ./mongo-init.js:/mongo-init.js:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--quiet", "/mongo-init.js"]

  kafka:
    image: bitnamilegacy/kafka:3.4
    ports:
      # Kafka returns this address in metadata; clients need a stable advertised port.
      - "127.0.0.1:${NOTIFICATIONS_KAFKA_PORT:-19094}:${NOTIFICATIONS_KAFKA_PORT:-19094}"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: notificationsTest12345
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:${NOTIFICATIONS_KAFKA_PORT:-19094}
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${NOTIFICATIONS_KAFKA_PORT:-19094}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    tmpfs:
      - /bitnami/kafka:uid=1001,gid=1001
    healthcheck:
      <<: *healthcheck
      timeout: 10s
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"]

  elasticsearch:
    image: elasticsearch:8.6.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "127.0.0.1::9200"
    tmpfs:
      - /usr/share/elasticsearch/data:uid=1000,gid=0
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s'"]

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: notifications_test
      RABBITMQ_DEFAULT_PASS: notifications_test
      RABBITMQ_DEFAULT_VHOST: notifications_test
    ports:
      - "127.0.0.1::5672"
      - "127.0.0.1::15672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]

  smtp:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "1000"
    ports:
      - "127.0.0.1::1025"
      - "127.0.0.1::8025"
    tmpfs:
      - /tmp
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  shard-one:
    image: mongo:7.0
    profiles: ["sharded"]
    command: ["mongod", "--shardsvr", "--replSet", "test-shard-one", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25", "--setParameter", "transactionLifetimeLimitSeconds=60"]
    environment:
      TEST_REPLICA_SET: test-shard-one
      TEST_REPLICA_HOST: shard-one
    tmpfs: [/data/db, /data/configdb]
    volumes: ["./mongo-shard-init.js:/init.js:ro"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--quiet", "/init.js"]

  shard-two:
    image: mongo:7.0
    profiles: ["sharded"]
    command: ["mongod", "--shardsvr", "--replSet", "test-shard-two", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25", "--setParameter", "transactionLifetimeLimitSeconds=60"]
    environment:
      TEST_REPLICA_SET: test-shard-two
      TEST_REPLICA_HOST: shard-two
    tmpfs: [/data/db, /data/configdb]
    volumes: ["./mongo-shard-init.js:/init.js:ro"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--quiet", "/init.js"]

  shard-config:
    image: mongo:7.0
    profiles: ["sharded"]
    command: ["mongod", "--configsvr", "--replSet", "test-config", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25", "--setParameter", "transactionLifetimeLimitSeconds=60"]
    environment:
      TEST_REPLICA_SET: test-config
      TEST_REPLICA_HOST: shard-config
    tmpfs: [/data/db, /data/configdb]
    volumes: ["./mongo-shard-init.js:/init.js:ro"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--quiet", "/init.js"]

  shard-router:
    image: mongo:7.0
    profiles: ["sharded"]
    command: ["mongos", "--configdb", "test-config/shard-config:27017", "--port", "27017", "--bind_ip_all"]
    ports: ["127.0.0.1::27017"]
    volumes: ["./mongo-router-init.js:/init.js:ro"]
    depends_on:
      shard-one: {condition: service_healthy}
      shard-two: {condition: service_healthy}
      shard-config: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--quiet", "/init.js"]
